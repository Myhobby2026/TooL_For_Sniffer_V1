name: Core CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-matrix:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            preset: linux-gcc-debug
          - os: ubuntu-22.04
            compiler: clang-15
            preset: linux-clang-debug
          - os: windows-2022
            compiler: msvc
            preset: windows-msvc-debug
          - os: macos-13
            compiler: apple-clang
            preset: macos-clang-debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CMake and Ninja
        run: python -m pip install cmake ninja

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake preset
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run Test Suite
        run: ctest --preset all

  sanitizers:
    name: Sanitizers (ASan + TSan)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc-asan, linux-gcc-tsan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CMake and Ninja
        run: python -m pip install cmake ninja

      - name: Configure preset
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run Tests under Sanitizer
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
